<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rank Pokémon by a custom base-stat formula, using the stats from the game you pick.">
<meta name="theme-color" content="#12151A">
<title>Field Ranker — Pokémon Stat Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D7263D' stroke='%230c0c0c' stroke-width='2'/%3E%3Ccircle cx='11' cy='11' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>Field Ranker</h1>
        <div class="subtitle" id="subtitle">Loading…</div>
      </div>
    </div>
    <div class="count-readout" role="status" aria-label="Pokémon shown">SHOWING<br><span class="n" id="shownCount">–</span> / <span id="totalCount">–</span></div>
  </header>

  <div class="layout">

    <details class="panel" id="panel" open>
      <summary><h2>Score formula</h2><span class="current" id="currentFormula"></span></summary>
      <textarea id="formulaInput" class="formula-input" aria-label="Score formula" aria-describedby="formulaStatus" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="formula-status" id="formulaStatus" role="status">&nbsp;</div>

      <div class="chip-section">
        <div class="chip-label">Stats</div>
        <div class="chip-row" id="statChips"></div>
      </div>
      <div class="chip-section">
        <div class="chip-label">Functions</div>
        <div class="chip-row" id="fnChips"></div>
      </div>
      <div class="chip-section">
        <div class="chip-label">Common combos</div>
        <div class="chip-row" id="comboChips"></div>
      </div>

      <div class="presets">
        <h2 style="margin-top:16px;">Presets</h2>
        <div class="preset-grid" id="presetGrid"></div>
      </div>

      <div class="reset-line">
        <button class="textbtn" id="clearBtn">Clear</button>
        <button class="textbtn" id="resetBtn">Reset to BST</button>
      </div>
    </details>

    <main class="main">
      <div class="results-head">
        <label class="sr-only" for="searchBox">Search by name or type</label>
        <input class="search-box" id="searchBox" type="search" placeholder="Search by name or type…" autocomplete="off">
        <select class="sortdir" id="sortDir" aria-label="Sort order">
          <option value="desc">Highest first</option>
          <option value="asc">Lowest first</option>
        </select>
      </div>
      <ol class="list" id="list" role="list"></ol>
      <footer>Tap a row for its full stat breakdown. Edit the formula anytime — nothing is precomputed.</footer>
    </main>

  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
