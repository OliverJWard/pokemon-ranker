<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRLG Field Ranker — Gen I Stat Terminal</title>
<style>

:root{
  --bg-deep:#12151A;
  --panel:#1B2027;
  --panel-raised:#222831;
  --hairline:#2B323C;
  --text-primary:#E9ECEF;
  --text-muted:#818B99;
  --text-faint:#565F6C;
  --scan-red:#D7263D;
  --lcd-green:#8FD14F;
  --lcd-green-dim:#4E6B36;
  --amber:#E8A33D;
}

*{box-sizing:border-box;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Space Grotesk',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- Header ---------- */
header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid var(--hairline);
  padding-bottom:18px;
  margin-bottom:24px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0 3px, var(--scan-red) 4px 60%, #7a0e1c 100%);
  border:2px solid #0c0c0c;
  flex-shrink:0;
}
h1{
  font-size:1.5rem;
  margin:0;
  letter-spacing:0.01em;
  font-weight:700;
}
.subtitle{color:var(--text-muted);font-size:0.9rem;margin-top:2px;}
.count-readout{
  font-family:'Space Mono',monospace;
  color:var(--lcd-green);
  font-size:0.85rem;
  text-align:right;
}
.count-readout .n{font-size:1.4rem;font-weight:700;}

/* ---------- Layout ---------- */
.layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:24px;
  align-items:start;
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;}
}

/* ---------- Control panel ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:10px;
  padding:18px;
  position:sticky;
  top:16px;
}
@media (max-width:860px){.panel{position:static;}}

.panel h2{
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.12em;
  color:var(--text-muted);
  margin:0 0 14px;
  font-weight:500;
}

.stat-row{margin-bottom:14px;}
.stat-row-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:4px;
}
.stat-name{font-size:0.86rem;color:var(--text-primary);}
.stat-weight{
  font-family:'Space Mono',monospace;
  font-size:0.86rem;
  color:var(--amber);
  min-width:34px;
  text-align:right;
}
input[type=range]{
  -webkit-appearance:none;
  width:100%;
  height:4px;
  border-radius:2px;
  background:linear-gradient(to right, var(--lcd-green-dim), var(--hairline));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:15px;height:15px;
  border-radius:50%;
  background:var(--lcd-green);
  border:2px solid #0c0c0c;
  cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;
  background:var(--lcd-green);border:2px solid #0c0c0c;cursor:pointer;
}

.formula-input{
  width:100%;
  min-height:64px;
  resize:vertical;
  background:#0E1116;
  border:1px solid var(--hairline);
  border-radius:8px;
  padding:10px 12px;
  color:var(--lcd-green);
  font-family:'Space Mono',monospace;
  font-size:0.86rem;
  line-height:1.45;
}
.formula-input:focus{outline:none;border-color:var(--lcd-green);}
.formula-status{
  margin-top:6px;
  min-height:16px;
  font-size:0.72rem;
  font-family:'Space Mono',monospace;
  color:var(--text-faint);
}
.formula-status.err{color:var(--scan-red);}
.formula-status.ok{color:var(--lcd-green);}

.chip-section{margin-top:14px;}
.chip-label{
  font-size:0.62rem;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--text-faint);
  margin-bottom:6px;
}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
button.chip{
  background:var(--panel-raised);
  border:1px solid var(--hairline);
  color:var(--text-primary);
  font-family:'Space Mono',monospace;
  font-size:0.74rem;
  padding:5px 9px;
  border-radius:6px;
  cursor:pointer;
}
button.chip:hover{border-color:var(--lcd-green);color:var(--lcd-green);}
button.chip.combo{
  font-family:'Space Grotesk',sans-serif;
  color:var(--amber);
}

.presets{margin-top:16px;}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
button.preset{
  background:var(--panel-raised);
  border:1px solid var(--hairline);
  color:var(--text-primary);
  font-family:'Space Grotesk',sans-serif;
  font-size:0.76rem;
  padding:8px 6px;
  border-radius:6px;
  cursor:pointer;
  transition:border-color .15s ease, color .15s ease;
}
button.preset:hover{border-color:var(--lcd-green);color:var(--lcd-green);}

.reset-line{
  margin-top:12px;
  display:flex;
  gap:8px;
}
button.textbtn{
  flex:1;
  background:none;
  border:1px solid var(--hairline);
  color:var(--text-muted);
  font-family:'Space Grotesk',sans-serif;
  font-size:0.76rem;
  padding:7px 6px;
  border-radius:6px;
  cursor:pointer;
}
button.textbtn:hover{color:var(--scan-red);border-color:var(--scan-red);}

/* ---------- Results ---------- */
.results-head{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.search-box{
  flex:1;
  min-width:180px;
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:8px;
  padding:9px 12px;
  color:var(--text-primary);
  font-family:'Space Grotesk',sans-serif;
  font-size:0.88rem;
}
.search-box::placeholder{color:var(--text-faint);}
.search-box:focus{outline:none;border-color:var(--lcd-green);}

select.sortdir{
  background:var(--panel);
  border:1px solid var(--hairline);
  color:var(--text-primary);
  border-radius:8px;
  padding:9px 10px;
  font-family:'Space Grotesk',sans-serif;
  font-size:0.85rem;
}

.list{
  border:1px solid var(--hairline);
  border-radius:10px;
  overflow:hidden;
}
.row{
  display:grid;
  grid-template-columns:40px 1fr 120px 90px;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:var(--panel);
  border-bottom:1px solid var(--hairline);
  cursor:pointer;
}
.row:last-child{border-bottom:none;}
.row:hover{background:var(--panel-raised);}
.row.top1{background:linear-gradient(90deg, rgba(143,209,79,0.10), transparent 70%);}

.rank{
  font-family:'Space Mono',monospace;
  color:var(--text-faint);
  font-size:0.85rem;
}
.rank.r1{color:var(--amber);font-weight:700;}
.rank.r2{color:#C9CFD6;}
.rank.r3{color:#B08D57;}

.name-cell{display:flex;flex-direction:column;gap:4px;min-width:0;}
.name-line{display:flex;align-items:baseline;gap:8px;}
.pname{font-weight:700;font-size:0.95rem;}
.pnum{font-family:'Space Mono',monospace;color:var(--text-faint);font-size:0.72rem;}
.types{display:flex;gap:5px;flex-wrap:wrap;}
.type-badge{
  font-size:0.62rem;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:4px;
  color:#12151A;
  font-weight:700;
}

.bar-track{
  height:7px;
  background:var(--hairline);
  border-radius:4px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  background:var(--lcd-green);
  border-radius:4px;
}

.score-cell{
  font-family:'Space Mono',monospace;
  text-align:right;
  color:var(--lcd-green);
  font-size:0.95rem;
  font-weight:700;
}

.breakdown{
  grid-column:1 / -1;
  display:none;
  padding:10px 14px 14px 52px;
  background:#0E1116;
  border-top:1px dashed var(--hairline);
}
.row.open + .breakdown{display:block;}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}
@media (max-width:640px){
  .stat-grid{grid-template-columns:repeat(3,1fr);}
  .row{grid-template-columns:32px 1fr 70px;}
  .bar-cell{display:none;}
}
.stat-chip{text-align:center;}
.stat-chip .v{font-family:'Space Mono',monospace;font-size:0.95rem;color:var(--text-primary);}
.stat-chip .k{font-size:0.62rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

.empty{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
  font-size:0.9rem;
}

footer{
  margin-top:22px;
  color:var(--text-faint);
  font-size:0.74rem;
  text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>Field Ranker</h1>
        <div class="subtitle">Gen I roster · FireRed &amp; LeafGreen · scored by base stats</div>
      </div>
    </div>
    <div class="count-readout">SHOWING<br><span class="n" id="shownCount">151</span> / 151</div>
  </header>

  <div class="layout">

    <div class="panel">
      <h2>Score formula</h2>
      <textarea id="formulaInput" class="formula-input" spellcheck="false">hp + atk + def + spa + spd + spe</textarea>
      <div class="formula-status" id="formulaStatus">&nbsp;</div>

      <div class="chip-section">
        <div class="chip-label">Stats</div>
        <div class="chip-row" id="statChips"></div>
      </div>
      <div class="chip-section">
        <div class="chip-label">Functions</div>
        <div class="chip-row" id="fnChips"></div>
      </div>
      <div class="chip-section">
        <div class="chip-label">Common combos</div>
        <div class="chip-row" id="comboChips"></div>
      </div>

      <div class="presets">
        <h2 style="margin-top:16px;">Presets</h2>
        <div class="preset-grid">
          <button class="preset" data-preset="bst">Balanced (BST)</button>
          <button class="preset" data-preset="physical">Physical sweeper</button>
          <button class="preset" data-preset="special">Special sweeper</button>
          <button class="preset" data-preset="tank">Tank</button>
          <button class="preset" data-preset="speed">Pure speed</button>
          <button class="preset" data-preset="frail">Glass cannon</button>
        </div>
      </div>

      <div class="reset-line">
        <button class="textbtn" id="clearBtn">Clear</button>
        <button class="textbtn" id="resetBtn">Reset to BST</button>
      </div>
    </div>

    <div class="main">
      <div class="results-head">
        <input class="search-box" id="searchBox" type="text" placeholder="Search by name or type…">
        <select class="sortdir" id="sortDir">
          <option value="desc">Highest first</option>
          <option value="asc">Lowest first</option>
        </select>
      </div>
      <div class="list" id="list"></div>
      <footer>Tap a row for its full stat breakdown. Edit the formula anytime — nothing is precomputed.</footer>
    </div>

  </div>
</div>

  name:row[0],
  types:row[1],
  hp:row[2],atk:row[3],def:row[4],spa:row[5],spd:row[6],spe:row[7]
}));

const TYPE_COLORS = {
  Normal:"#A8A77A",Fire:"#EE8130",Water:"#6390F0",Electric:"#F7D02C",
  Grass:"#7AC74C",Ice:"#96D9D6",Fighting:"#C22E28",Poison:"#A33EA1",
  Ground:"#E2BF65",Flying:"#A98FF3",Psychic:"#F95587",Bug:"#A6B91A",
  Rock:"#B6A136",Ghost:"#735797",Dragon:"#6F35FC"
};

const STAT_KEYS = [
  {k:"hp",label:"HP"},
  {k:"atk",label:"ATK"},
  {k:"def",label:"DEF"},
  {k:"spa",label:"SPA"},
  {k:"spd",label:"SPD"},
  {k:"spe",label:"SPE"}
];

let sortDir = "desc";
let searchText = "";
let openId = null;
let currentFormula = "hp + atk + def + spa + spd + spe";
let compiledFn = null;
let lastGoodFn = null;

// ---------- Tiny, safe expression parser ----------
// Supports: + - * / ^, unary -, parentheses, numbers,
// variables hp/atk/def/spa/spd/spe/bst, and min()/max()/abs() calls.
const VARS = ["hp","atk","def","spa","spd","spe","bst"];
const FUNCS = ["min","max","abs"];

function tokenize(src){
  const tokens = [];
  let i = 0;
  while(i < src.length){
    const c = src[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/[0-9.]/.test(c)){
      let j = i;
      while(j < src.length && /[0-9.]/.test(src[j])) j++;
      tokens.push({type:"num", value: parseFloat(src.slice(i,j))});
      i = j; continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let j = i;
      while(j < src.length && /[a-zA-Z_0-9]/.test(src[j])) j++;
      tokens.push({type:"ident", value: src.slice(i,j).toLowerCase()});
      i = j; continue;
    }
    if("+-*/^(),".includes(c)){
      tokens.push({type:c});
      i++; continue;
    }
    throw new Error(`Unexpected character "${c}"`);
  }
  return tokens;
}

function parseExpression(tokens){
  let pos = 0;
  function peek(){ return tokens[pos]; }
  function next(){ return tokens[pos++]; }

  function parseAdd(){
    let node = parseMul();
    while(peek() && (peek().type === "+" || peek().type === "-")){
      const op = next().type;
      node = {type:"bin", op, left:node, right:parseMul()};
    }
    return node;
  }
  function parseMul(){
    let node = parsePow();
    while(peek() && (peek().type === "*" || peek().type === "/")){
      const op = next().type;
      node = {type:"bin", op, left:node, right:parsePow()};
    }
    return node;
  }
  function parsePow(){
    let node = parseUnary();
    if(peek() && peek().type === "^"){
      next();
      return {type:"bin", op:"^", left:node, right:parsePow()};
    }
    return node;
  }
  function parseUnary(){
    if(peek() && peek().type === "-"){
      next();
      return {type:"neg", value:parseUnary()};
    }
    return parsePrimary();
  }
  function parsePrimary(){
    const t = peek();
    if(!t) throw new Error("Unexpected end of formula");
    if(t.type === "num"){ next(); return {type:"num", value:t.value}; }
    if(t.type === "("){
      next();
      const node = parseAdd();
      if(!peek() || peek().type !== ")") throw new Error('Missing closing ")"');
      next();
      return node;
    }
    if(t.type === "ident"){
      next();
      if(peek() && peek().type === "("){
        next();
        const args = [];
        if(peek() && peek().type !== ")"){
          args.push(parseAdd());
          while(peek() && peek().type === ","){ next(); args.push(parseAdd()); }
        }
        if(!peek() || peek().type !== ")") throw new Error('Missing closing ")" after function call');
        next();
        if(!FUNCS.includes(t.value)) throw new Error(`Unknown function "${t.value}()"`);
        return {type:"call", name:t.value, args};
      }
      if(!VARS.includes(t.value)) throw new Error(`Unknown variable "${t.value}"`);
      return {type:"var", name:t.value};
    }
    throw new Error(`Unexpected token near "${t.type}"`);
  }

  const ast = parseAdd();
  if(pos !== tokens.length) throw new Error("Unexpected trailing input");
  return ast;
}

function evalAst(node, ctx){
  switch(node.type){
    case "num": return node.value;
    case "var": return ctx[node.name];
    case "neg": return -evalAst(node.value, ctx);
    case "bin":{
      const l = evalAst(node.left, ctx), r = evalAst(node.right, ctx);
      if(node.op === "+") return l + r;
      if(node.op === "-") return l - r;
      if(node.op === "*") return l * r;
      if(node.op === "/") return l / r;
      if(node.op === "^") return Math.pow(l, r);
      break;
    }
    case "call":{
      const vals = node.args.map(a=>evalAst(a, ctx));
      if(node.name === "min") return Math.min(...vals);
      if(node.name === "max") return Math.max(...vals);
      if(node.name === "abs") return Math.abs(vals[0]);
      break;
    }
  }
  throw new Error("Cannot evaluate expression");
}

function compileFormula(src){
  const tokens = tokenize(src);
  const ast = parseExpression(tokens);
  return (p)=>{
    const ctx = {hp:p.hp, atk:p.atk, def:p.def, spa:p.spa, spd:p.spd, spe:p.spe,
                 bst: p.hp+p.atk+p.def+p.spa+p.spd+p.spe};
    const v = evalAst(ast, ctx);
    if(typeof v !== "number" || !isFinite(v)) throw new Error("Formula produced a non-numeric result");
    return v;
  };
}

function score(p){
  return lastGoodFn ? lastGoodFn(p) : 0;
}

function handleFormulaChange(){
  currentFormula = document.getElementById("formulaInput").value;
  const status = document.getElementById("formulaStatus");
  try{
    const fn = compileFormula(currentFormula);
    // sanity-run against the whole roster before accepting
    POKEMON.forEach(fn);
    compiledFn = fn;
    lastGoodFn = fn;
    status.textContent = "Valid — ranking live";
    status.className = "formula-status ok";
  }catch(err){
    compiledFn = null;
    status.textContent = "Not applied: " + err.message;
    status.className = "formula-status err";
  }
  render();
}

function setFormula(src){
  document.getElementById("formulaInput").value = src;
  handleFormulaChange();
}

function insertAtCursor(text, cursorOffset){
  const input = document.getElementById("formulaInput");
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  const before = input.value.slice(0, start);
  const after = input.value.slice(end);
  input.value = before + text + after;
  const newPos = start + (cursorOffset !== undefined ? cursorOffset : text.length);
  input.focus();
  input.setSelectionRange(newPos, newPos);
  handleFormulaChange();
}

function buildChips(){
  const statChips = document.getElementById("statChips");
  ["hp","atk","def","spa","spd","spe","bst"].forEach(v=>{
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = v;
    b.addEventListener("click",()=>insertAtCursor(v));
    statChips.appendChild(b);
  });

  const fnChips = document.getElementById("fnChips");
  [["min(a, b)","min(",4],["max(a, b)","max(",4],["abs(a)","abs(",4]].forEach(([label,text,offset])=>{
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.addEventListener("click",()=>insertAtCursor(text + ")".repeat((text.match(/\(/g)||[]).length), offset));
    fnChips.appendChild(b);
  });

  const comboChips = document.getElementById("comboChips");
  [
    ["Lowest defense", "min(def, spd)"],
    ["Highest attack", "max(atk, spa)"],
    ["Bulk (def × hp)", "min(def, spd) * hp"],
    ["Frailty (atk ÷ def)", "max(atk, spa) / min(def, spd)"]
  ].forEach(([label, text])=>{
    const b = document.createElement("button");
    b.className = "chip combo";
    b.textContent = label;
    b.addEventListener("click",()=>insertAtCursor(text));
    comboChips.appendChild(b);
  });
}

const PRESETS = {
  bst:      "hp + atk + def + spa + spd + spe",
  physical: "atk*1.5 + spe*1.5 + def*0.25",
  special:  "spa*1.5 + spe*1.5 + spd*0.25",
  tank:     "hp*1.5 + min(def, spd)*1.5 - spe*0.5",
  speed:    "spe",
  frail:    "max(atk, spa)*2 + spe*1.5 - min(def, spd)*0.5"
};

document.querySelectorAll("button.preset").forEach(btn=>{
  btn.addEventListener("click",()=>setFormula(PRESETS[btn.dataset.preset]));
});
document.getElementById("clearBtn").addEventListener("click",()=>setFormula(""));
document.getElementById("resetBtn").addEventListener("click",()=>setFormula(PRESETS.bst));
document.getElementById("formulaInput").addEventListener("input", handleFormulaChange);

buildChips();

document.getElementById("searchBox").addEventListener("input",(e)=>{
  searchText = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("sortDir").addEventListener("change",(e)=>{
  sortDir = e.target.value;
  render();
});

function render(){
  const list = document.getElementById("list");

  const maxScore = Math.max(...POKEMON.map(score));
  const minScore = Math.min(...POKEMON.map(score));
  const range = (maxScore - minScore) || 1;

  let filtered = POKEMON.filter(p=>{
    if(!searchText) return true;
    return p.name.toLowerCase().includes(searchText) ||
           p.types.some(t=>t.toLowerCase().includes(searchText));
  });

  filtered = filtered.map(p=>({p, s: score(p)}));
  filtered.sort((a,b)=> sortDir === "desc" ? b.s - a.s : a.s - b.s);

  document.getElementById("shownCount").textContent = filtered.length;

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">No Pokémon match “${searchText}”.</div>`;
    return;
  }

  list.innerHTML = filtered.map((entry, idx)=>{
    const p = entry.p;
    const sc = entry.s;
    const pct = Math.max(2, ((sc - minScore) / range) * 100);
    const rankClass = idx===0 ? "r1" : idx===1 ? "r2" : idx===2 ? "r3" : "";
    const typeBadges = p.types.map(t=>
      `<span class="type-badge" style="background:${TYPE_COLORS[t]}">${t}</span>`
    ).join("");
    const isOpen = openId === p.id;
    const statChips = STAT_KEYS.map(s=>`
      <div class="stat-chip">
        <div class="v">${p[s.k]}</div>
        <div class="k">${s.label}</div>
      </div>
    `).join("");

    return `
      <div class="row ${idx===0?'top1':''} ${isOpen?'open':''}" data-id="${p.id}">
        <div class="rank ${rankClass}">${idx+1}</div>
        <div class="name-cell">
          <div class="name-line">
            <span class="pname">${p.name}</span>
            <span class="pnum">#${String(p.id).padStart(3,"0")}</span>
          </div>
          <div class="types">${typeBadges}</div>
        </div>
        <div class="bar-cell bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="score-cell">${sc.toFixed(1)}</div>
      </div>
      <div class="breakdown">
        <div class="stat-grid">${statChips}</div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".row").forEach(row=>{
    row.addEventListener("click",()=>{
      const id = parseInt(row.dataset.id,10);
      openId = openId === id ? null : id;
      render();
    });
  });
}

handleFormulaChange();
</script>
</body>
</html>
